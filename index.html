<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoの日本語</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- 1. Core Polyfills -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.37.1/minified.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/regenerator-runtime/0.14.1/runtime.min.js"></script>
    
    <!-- 2. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: {
                        sans: ['PingFang SC', 'Hiragino Sans', 'Noto Sans JP', 'Microsoft YaHei', 'Inter', 'sans-serif'],
                    }
                } 
            }
        }
    </script>

    <!-- 3. React -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 4. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 5. Firebase v8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        * { 
            font-family: 'PingFang SC', 'Hiragino Sans', 'Noto Sans JP', 'Microsoft YaHei', 'Inter', sans-serif !important; 
        }
        
        body {
            background-color: #e0e5ec;
            transition: background-color 0.2s ease;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            font-weight: 400;
        }
        
        :root { --ease-apple: cubic-bezier(0.25, 0.1, 0.25, 1); }
        .animate-fade-up { animation: fadeUp 0.4s var(--ease-apple) forwards; opacity: 0; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Neumorphism Styles */
        .emboss-soft { box-shadow: 6px 6px 12px rgba(163,177,198,0.3), -4px -4px 10px rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.4); background-color: #e0e5ec; }
        .dark .emboss-soft { box-shadow: 5px 5px 10px rgba(0,0,0,0.8), -2px -2px 5px rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.02); background-color: #121212; }
        
        .emboss-frame { box-shadow: 4px 4px 8px rgba(163,177,198,0.3), -4px -4px 8px rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.4); background-color: #e0e5ec; }
        .dark .emboss-frame { box-shadow: 4px 4px 8px rgba(0,0,0,0.8), -2px -2px 5px rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.02); background-color: #121212; }
        
        .emboss-card { box-shadow: 8px 8px 16px rgba(163,177,198,0.4), -8px -8px 16px rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.15); background-color: #e0e5ec; }
        .dark .emboss-card { box-shadow: 8px 8px 15px rgba(0,0,0,0.9), -2px -2px 5px rgba(255,255,255,0.05); background-color: #121212; }
        
        .emboss-btn { box-shadow: 2px 2px 5px rgba(163,177,198,0.3), -2px -2px 5px rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.3); background-color: #e0e5ec; transition: transform 0.2s; }
        .emboss-btn:active { transform: scale(0.96); }
        .dark .emboss-btn { box-shadow: 3px 3px 6px rgba(0,0,0,0.8), -1px -1px 3px rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.02); background-color: #121212; }

        .loading-spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 特制描边字体背景 */
        .agent-bg-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22vw;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.12);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
            font-style: italic;
        }
        .dark .agent-bg-text { -webkit-text-stroke: 1px rgba(255, 255, 255, 0.06); }
        
        /* 强制让 SVG 图标内容限制在容器内部 */
        svg { overflow: visible !important; }
    </style>
</head>
<body class="dark:bg-[#0a0a0a]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const ROLE_MAPPING = [
            { id: "All", label: "ALL" },
            { id: "Duelist", label: "决斗" },
            { id: "Controller", label: "烟位" },

        const POPULARITY_RANK = ["Jett", "Reyna", "Clove", "Omen", "Sova", "Gekko", "Sage", "Iso", "Cypher", "Neon", "Raze", "Chamber", "Viper", "Yoru", "Killjoy", "Breach", "Skye", "Fade", "Brimstone", "KAY/O", "Deadlock", "Astra", "Harbor", "Phoenix", "Vyse"];

        const COMMUNITY_CALLOUTS = {

            "Leer": "目", "Devour": "回復", "Dismiss": "ディスミス", "Empress": "ウルト",
            "Blaze": "壁", "Curveball": "フラッシュ", "Hot Hands": "モロトフ", "Run it Back": "ウルト",
            "Boom Bot": "ドローン", "Blast Pack": "サッチェル", "Paint Shells": "グレ", "Showstopper": "ウルト",
            "Fakeout": "デコイ", "Blindside": "フラッシュ", "Gatecrash": "テレポート", "Dimensional Drift": "ウルト",
            "Ruse": "モク", "Meddle": "弱体化", "Pick-me-up": "回復", "Not Dead Yet": "復活",
            "Shrouded Step": "テレポート", "Paranoia": "パラ", "Dark Cover": "モク", "From the Shadows": "ウルト",
            "Incendiary": "モロトフ", "Sky Smoke": "モク", "Stim Beacon": "ビーコン", "Orbital Strike": "空爆",
            "Snake Bite": "毒", "Poison Cloud": "モク", "Toxic Screen": "カーテン", "Viper's Pit": "ウルト",
            "Gravity Well": "吸い込み", "Nova Pulse": "スタン", "Nebula": "モク", "Cosmic Divide": "壁",
            "Cascade": "壁", "Cove": "ドーム", "High Tide": "カーテン", "Reckoning": "ウルト",
            "Owl Drone": "ドローン", "Shock Bolt": "ショック", "Recon Bolt": "リコン", "Hunter's Fury": "ウルト",
            "Mosh Pit": "モッシュ", "Wingman": "ウィングマン", "Dizzy": "ディジー", "Thrash": "ウルト",
            "Aftershock": "アフターショック", "Flashpoint": "フラッシュ", "Fault Line": "スタン", "Rolling Thunder": "ウルト",
            "Regrowth": "ヒール", "Trailblazer": "犬", "Guiding Light": "鸟", "Seekers": "ウルト",
            "FRAGMENT": "グレ", "FLASH/DRIVE": "フラッシュ", "ZERO/POINT": "ナイフ", "NULL/CMD": "ウルト",
            "Prowler": "プラウラー", "Seize": "シーズ", "Haunt": "目", "Nightfall": "ウルト",
            "Barrier Orb": "壁", "Slow Orb": "スロウ", "Healing Orb": "ヒール", "Resurrection": "蘇生",
            "Trapwire": "ワイヤー", "Cyber Cage": "ケージ", "Spycam": "カメラ", "Neural Theft": "ウルト",
            "Nanoswarm": "グレ", "Alarmbot": "アラームボット", "Turret": "タレット", "Lockdown": "ロックダウン",
            "Trademark": "トレードマーク", "Headhunter": "ヘッドハンター", "Rendezvous": "テレポート", "Tour De Force": "オペ",
            "GravNet": "ネット", "Sonic Sensor": "传感器", "Barrier Mesh": "壁", "Annihilation": "ウルト",
            "Razorvine": "ヴァイン", "Shear": "壁", "Arc Rose": "花", "Steel Garden": "ウルト"
        };

        const apiKey = ""; 
        const encodedConfig = "eyJhcGlLZXkiOiJBSXphU3lEamhndkE5RElES1FZMXI0Yll5VHkwWjBHM1BYUkFvaE0iLCJhdXRoRG9tYWluIjoidmFsb3JhbnQtamFwYW5lc2UuZmlyZWJhc2VhcHAuY29tIiwicHJvamVjdElkIjoidmFsb3JhbnQtamFwYW5lc2UiLCJzdG9yYWdlQnVja2V0IjoidmFsb3JhbnQtamFwYW5lc2UuZmlyZWJhc2VzdG9yYWdlLmFwcCIsIm1lc3NhZ2luZ1NlbmRlcklkIjoiNDg2NzA0MzI3MjEwIiwiYXBwSWQiOiIxOjQ4NjcwNDMyNzIxMDp3ZWI6MDVjYWFmODI0M2U4N2VmZmUwYjE1MyIsIm1lYXN1cmVtZW50SWQiOiJHLUw3VkJZMFFMUEUifQ==";
        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : JSON.parse(atob(encodedConfig));
        } catch (e) {}
        
        if (!firebase.apps.length && firebaseConfig) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'valorant-jp-web';

        async function fetchHiragana(text) {
            if (!text || !text.trim() || text === '---') return "";
            const systemPrompt = "你是专业日语助手。请将用户输入的日语转换为最标准的纯平假名。禁止输出任何其他解释文字。";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text?.replace(/\s+/g, '').trim() || "";
            } catch (e) { return ""; }
        }

        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Volume2 = (p) => <IconBase {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></IconBase>;
        const ArrowLeft = (p) => <IconBase {...p}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></IconBase>;
        const Search = (p) => <IconBase {...p}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></IconBase>;
        const Sun = (p) => <IconBase {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></IconBase>;
        const Moon = (p) => <IconBase {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></IconBase>;
        const Plus = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></IconBase>;
        const MessageCircle = (p) => <IconBase {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></IconBase>;
        const Users = (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
        const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
        const Edit3 = (p) => <IconBase {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></IconBase>;

        const useSpeech = () => {
          const vRef = useRef([]);
          useEffect(() => {
            const upd = () => { if (window.speechSynthesis) vRef.current = window.speechSynthesis.getVoices(); };
            upd(); if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = upd;
          }, []);
          return { speak: (t) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t); u.rate = 0.95; u.lang = 'ja-JP';
            const jV = vRef.current.find(v => v.lang.includes('ja'));
            if (jV) u.voice = jV; window.speechSynthesis.speak(u);
          }};
        };

        const PhraseModal = ({ isOpen, onClose, agents, onSave, isSaving, editData = null }) => {
            const [form, setForm] = useState({ text: '', romaji: '', icons: [] });
            const [sT, setST] = useState('All');
            const [eA, setEA] = useState(null);
            const [isConv, setIsConv] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    if (editData) setForm({ text: editData.text, romaji: editData.romaji, icons: editData.icons || [] });
                    else setForm({ text: '', romaji: '', icons: [] });
                }
            }, [isOpen, editData]);

            const filtered = useMemo(() => agents.filter(a => a.skills.length > 0 && (sT === 'All' || a.role === sT)), [sT, agents]);

            const handleText = async (v) => {
                setForm(p => ({ ...p, text: v }));
                if (!v.trim()) { setForm(p => ({ ...p, romaji: '' })); return; }
                if (window.cT) clearTimeout(window.cT);
                window.cT = setTimeout(async () => {
                    setIsConv(true); 
                    const h = await fetchHiragana(v);
                    setForm(p => ({ ...p, romaji: h })); 
                    setIsConv(false);
                }, 800);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="w-full max-w-xl max-h-[90vh] overflow-y-auto hide-scrollbar emboss-card rounded-[40px] p-8 space-y-6 animate-fade-in">
                        <div className="flex justify-between items-center">
                            <h2 className="text-xl font-black dark:text-white uppercase tracking-tighter">{editData ? '修改语句' : '发布新语句'}</h2>
                            <button onClick={onClose} className="w-8 h-8 rounded-full emboss-btn flex items-center justify-center text-gray-400 hover:text-red-500 transition-colors font-black">✕</button>
                        </div>
                        
                        <div className="space-y-4">
                            <label className="text-[10px] font-black text-gray-500 uppercase block tracking-[0.2em] opacity-60">1. 选择关联图标</label>
                            <div className="flex gap-1 overflow-x-auto hide-scrollbar mb-3 bg-black/5 dark:bg-white/5 p-1 rounded-full w-fit">
                                {ROLE_MAPPING.map(r => (
                                    <button key={r.id} onClick={() => setST(r.id)} className={`px-4 py-2 rounded-full transition-all flex items-center justify-center ${sT === r.id ? 'bg-white dark:bg-white text-black shadow-sm' : 'text-gray-400'}`}>
                                        <span className="text-[10px] font-black">{r.label}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="grid grid-cols-2 gap-3 max-h-[260px] overflow-y-auto pr-2 hide-scrollbar">
                                {filtered.map(a => (
                                    <div key={a.id} className="space-y-2">
                                        <button onClick={() => setEA(eA === a.id ? null : a.id)} className="w-full p-3 rounded-2xl bg-black/5 dark:bg-white/5 text-[11px] font-black text-left hover:bg-black/10 transition-colors flex justify-between items-center group uppercase italic">
                                            <div className="flex items-center gap-2">
                                                <div className="w-7 h-7 rounded-lg bg-white/10 overflow-hidden shadow-inner"><img src={a.fullPortrait} className="w-full h-full object-cover" /></div>
                                                <span>{a.name}</span>
                                            </div>
                                            <span className={`text-[8px] uppercase font-black px-1.5 py-0.5 rounded transition-all ${eA === a.id ? 'bg-[#ff4655] text-white' : 'opacity-20'}`}>SEL</span>
                                        </button>
                                        {eA === a.id && (
                                            <div className="grid grid-cols-4 gap-1.5 p-2 bg-black/20 dark:bg-white/10 rounded-2xl animate-fade-in shadow-inner">
                                                {a.skills.map(s => (
                                                    <button 
                                                        key={s.icon} 
                                                        onClick={() => setForm(p => ({...p, icons: p.icons.includes(s.icon) ? p.icons.filter(i=>i!==s.icon) : [...p.icons, s.icon]}))} 
                                                        className={`p-1.5 rounded-xl border-2 transition-all aspect-square flex items-center justify-center ${form.icons.includes(s.icon) ? 'border-[#ff4655] bg-[#ff4655]/30' : 'border-transparent bg-black/10 dark:bg-white/5'}`}
                                                    >
                                                        <img src={s.icon} className="w-5 h-5 object-contain contrast-[1.4] brightness-110" />
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-4">
                            <div className="space-y-1">
                                <div className="flex justify-between items-end">
                                    <label className="text-[10px] font-black text-gray-500 uppercase block tracking-[0.2em] opacity-60">2. 日文内容</label>
                                    {isConv && <div className="loading-spinner mb-1"></div>}
                                </div>
                                <input 
                                    value={form.text} 
                                    onChange={e => handleText(e.target.value)} 
                                    placeholder="例: Flashを投げましょうか？" 
                                    className="w-full emboss-frame rounded-2xl p-4 dark:bg-[#121212] focus:outline-none text-base font-bold transition-all shadow-inner" 
                                />
                            </div>
                        </div>

                        <div className="flex gap-4 pt-4">
                            <button onClick={onClose} className="flex-1 font-black text-gray-400 text-xs py-4 uppercase tracking-[0.2em]">取消</button>
                            <button 
                                onClick={() => onSave(form)} 
                                disabled={isSaving || !form.text || isConv} 
                                className="flex-[2] py-4 rounded-2xl bg-[#ff4655] text-white font-black shadow-xl shadow-[#ff4655]/20 disabled:opacity-30 transition-all text-xs flex items-center justify-center gap-2 uppercase tracking-[0.2em]"
                            >
                                {isSaving ? <div className="loading-spinner"></div> : (editData ? 'SAVE' : 'POST')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
          const [view, setView] = useState('agents'); 
          const [user, setUser] = useState(null);
          const [agents, setAgents] = useState([]);
          const [filteredAgents, setFilteredAgents] = useState([]);
          const [selectedAgent, setSelectedAgent] = useState(null);
          const [activeSkillIndex, setActiveSkillIndex] = useState(0);
          const [loading, setLoading] = useState(true);
          const [searchTerm, setSearchTerm] = useState('');
          const [selectedRole, setSelectedRole] = useState("All");
          const [isDark, setIsDark] = useState(false);
          const [phraseList, setPhraseList] = useState([]);
          const [isAddingPhrase, setIsAddingPhrase] = useState(false);
          const [editPhraseData, setEditPhraseData] = useState(null);
          const [isSavingPhrase, setIsSavingPhrase] = useState(false);
          const [skillHira, setSkillHira] = useState('');
          const [agentOverrides, setAgentOverrides] = useState({});
          const [isEditingCallout, setIsEditingCallout] = useState(false);
          const [editForm, setEditForm] = useState({ callout: '' });
          const [isGlobalSaving, setIsGlobalSaving] = useState(false);
          
          const { speak } = useSpeech();

          useEffect(() => {
            document.documentElement.classList.toggle('dark', isDark);
          }, [isDark]);

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                else await auth.signInAnonymously();
              } catch (e) {}
            };
            initAuth(); return auth.onAuthStateChanged(setUser);
          }, []);

          useEffect(() => {
            if (!user) return;
            const unsub1 = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('custom_phrases').onSnapshot(snap => {
                const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                setPhraseList(list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
            });
            const unsub2 = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('agent_overrides').onSnapshot(snap => {
                const ov = {}; snap.forEach(doc => ov[doc.id] = doc.data());
                setAgentOverrides(ov);
            });
            return () => { unsub1(); unsub2(); };
          }, [user]);

          useEffect(() => {
            const fetchA = async () => {
              try {
                const [rEn, rJa] = await Promise.all([
                  fetch('https://valorant-api.com/v1/agents?language=en-US&isPlayableCharacter=true'),
                  fetch('https://valorant-api.com/v1/agents?language=ja-JP&isPlayableCharacter=true')
                ]);
                const dEn = await rEn.json(), dJa = await rJa.json();
                const jM = new Map(dJa.data.map(a => [a.uuid, a]));
                const list = dEn.data.map(aEn => {
                  const aJa = jM.get(aEn.uuid);
                  return {
                    id: aEn.uuid, name: aEn.displayName, nameJa: aJa?.displayName || aEn.displayName,
                    role: aEn.role?.displayName || 'Agent', fullPortrait: aEn.fullPortrait,
                    colors: aEn.backgroundGradientColors?.map(c => '#' + c.substring(0, 6)) || ['#18181b', '#000000'],
                    skills: aEn.abilities.filter(s => s.slot !== 'Passive' && s.displayIcon).map(sEn => {
                      const sJa = aJa?.abilities?.find(j => j.slot === sEn.slot);
                      const callout = COMMUNITY_CALLOUTS[sEn.displayName] || sJa?.displayName || sEn.displayName;
                      return { slot: sEn.slot, nameEn: sEn.displayName, icon: sEn.displayIcon, jpName: sJa?.displayName || sEn.displayName, callout };
                    })
                  };
                }).sort((a, b) => {
                    const idxA = POPULARITY_RANK.indexOf(a.name);
                    const idxB = POPULARITY_RANK.indexOf(b.name);
                    return (idxA !== -1 ? idxA : 99) - (idxB !== -1 ? idxB : 99);
                });
                setAgents(list); setLoading(false);
              } catch (e) { setLoading(false); }
            };
            fetchA();
          }, []);

          useEffect(() => {
            const t = searchTerm.toLowerCase();
            let res = agents;
            if (selectedRole !== "All") res = res.filter(a => a.role === selectedRole);
            if (t) res = res.filter(a => a.name.toLowerCase().includes(t) || (a.nameJa && a.nameJa.includes(t)));
            setFilteredAgents(res);
          }, [searchTerm, selectedRole, agents]);

          useEffect(() => {
            if (selectedAgent) {
              const skill = selectedAgent.skills[activeSkillIndex];
              const overrideId = `${selectedAgent.id}_${skill.slot}`;
              const override = agentOverrides[overrideId];
              const updateHira = async () => {
                if (override?.hira) setSkillHira(override.hira);
                else { setSkillHira('...'); const h = await fetchHiragana(override?.callout || skill.callout); setSkillHira(h); }
              };
              updateHira();
            }
          }, [selectedAgent, activeSkillIndex, agentOverrides]);

          const handleSavePhrase = async (phraseData) => {
            if (!user) return;
            setIsAddingPhrase(false);
            const currentEditData = editPhraseData;
            setEditPhraseData(null);
            try {
              if (currentEditData) {
                  await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('custom_phrases').doc(currentEditData.id).update({
                      ...phraseData, updatedAt: Date.now()
                  });
              } else {
                  await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('custom_phrases').add({
                      ...phraseData, uid: user.uid, createdAt: Date.now()
                  });
              }
            } catch (e) { console.error("Save Error:", e); }
          };

          const saveAgentOverride = async () => {
            if (!user || !selectedAgent) return;
            const skill = selectedAgent.skills[activeSkillIndex];
            const overrideId = `${selectedAgent.id}_${skill.slot}`;
            setIsGlobalSaving(true);
            try {
              const autoHira = await fetchHiragana(editForm.callout);
              await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('agent_overrides').doc(overrideId).set({
                callout: editForm.callout, hira: autoHira, updatedAt: Date.now()
              });
              setIsEditingCallout(false);
            } catch (e) {}
            setIsGlobalSaving(false);
          };

          if (loading) return <div className="min-h-screen bg-[#e0e5ec] dark:bg-[#0a0a0a] flex items-center justify-center font-black text-gray-400 tracking-[0.4em] text-[11px] uppercase italic">Valorant JP Processing...</div>;

          const PhrasePage = () => (
              <div className="max-w-4xl mx-auto px-6 pt-24 pb-36 animate-fade-in">
                <div className="flex justify-between items-center mb-10">
                  <h1 className="text-2xl font-black dark:text-white border-l-4 border-[#ff4655] pl-5 tracking-tight uppercase">常用语句库</h1>
                  <button onClick={() => { setEditPhraseData(null); setIsAddingPhrase(true); }} className="w-12 h-12 rounded-full emboss-btn flex items-center justify-center text-[#ff4655] transition-transform hover:scale-110 active:scale-90 shadow-lg shadow-[#ff4655]/10"><Plus size={24} /></button>
                </div>
                
                <PhraseModal isOpen={isAddingPhrase} onClose={() => { setIsAddingPhrase(false); setEditPhraseData(null); }} agents={agents} onSave={handleSavePhrase} isSaving={isSavingPhrase} editData={editPhraseData} />

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {phraseList.map((p, idx) => (
                    <div key={p.id} className="emboss-card rounded-[24px] p-5 space-y-3 animate-fade-up group relative overflow-hidden transition-all hover:scale-[1.02]">
                      <div className="flex justify-between items-start">
                        <div className="flex gap-1.5 flex-wrap">{p.icons?.map((icon, i) => <div key={i} className="w-8 h-8 p-1.5 rounded-lg bg-black/5 dark:bg-white/5 shadow-inner"><img src={icon} className="w-full h-full object-contain contrast-[1.2] brightness-95" /></div>)}</div>
                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                            {user && p.uid === user.uid && (
                                <>
                                    <button onClick={() => { setEditPhraseData(p); setIsAddingPhrase(true); }} className="p-1.5 text-gray-400 hover:text-blue-500 transition-colors"><Edit3 size={14}/></button>
                                    <button onClick={() => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('custom_phrases').doc(p.id).delete()} className="p-1.5 text-gray-400 hover:text-red-500 transition-colors"><Trash2 size={14}/></button>
                                </>
                            )}
                        </div>
                      </div>
                      <div className="space-y-0.5"><p className="text-base font-black dark:text-white leading-snug">{p.text}</p><p className="text-[10px] font-black text-[#ff4655] tracking-widest opacity-80 uppercase">{p.romaji || '---'}</p></div>
                      <div className="flex justify-end"><button onClick={() => speak(p.text)} className="w-10 h-10 rounded-full bg-black dark:bg-white text-white dark:text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-md"><Volume2 size={18} /></button></div>
                    </div>
                  ))}
                </div>
              </div>
          );

          if (selectedAgent) {
            const skill = selectedAgent.skills[activeSkillIndex];
            const bgGradient = `linear-gradient(135deg, ${selectedAgent.colors[0]}44, ${selectedAgent.colors[1]}33)`;
            
            return (
              <div className="min-h-screen dark:bg-[#121212] bg-[#e0e5ec] text-gray-900 dark:text-white animate-fade-in flex flex-col relative" style={{ background: bgGradient }}>
                <div className="agent-bg-text select-none">{selectedAgent.name}</div>
                
                <nav className="fixed top-0 w-full z-50 h-16 flex items-center px-6 justify-between">
                  <button onClick={() => { setSelectedAgent(null); setIsEditingCallout(false); }} className="emboss-btn p-2 rounded-full transition-all bg-white/40 dark:bg-black/40 backdrop-blur-md"><ArrowLeft size={18} /></button>
                  <div className="font-black tracking-[0.6em] text-[10px] uppercase opacity-60 italic">{selectedAgent.name}</div><div className="w-8" />
                </nav>

                <div className="flex-1 pt-20 pb-32 max-w-7xl mx-auto px-6 flex flex-col lg:flex-row gap-8 items-center w-full relative z-10">
                  <div className="lg:w-1/2 flex items-center justify-center pointer-events-none drop-shadow-[0_20px_40px_rgba(0,0,0,0.35)]">
                    <img src={selectedAgent.fullPortrait} className="h-[70vh] object-contain animate-fade-in" />
                  </div>
                  
                  <div className="lg:w-1/2 w-full flex flex-col items-center lg:items-start space-y-4">
                    <div className="flex gap-3 p-2 bg-white/20 dark:bg-white/5 backdrop-blur-2xl rounded-[20px] shadow-xl border border-white/10 w-fit">
                      {selectedAgent.skills.map((s, i) => (
                        <button key={s.slot} onClick={() => { setActiveSkillIndex(i); setIsEditingCallout(false); }} className={`w-14 h-14 rounded-[14px] flex items-center justify-center transition-all ${i === activeSkillIndex ? 'bg-[#ff4655] scale-105 shadow-lg shadow-[#ff4655]/40' : 'bg-black/10 dark:bg-white/10 text-gray-400 hover:bg-black/20'}`}><img src={s.icon} className={`w-8 h-8 ${i === activeSkillIndex ? 'brightness-200' : 'opacity-40 invert dark:invert-0 contrast-[1.4]'}`} /></button>
                      ))}
                    </div>

                    <div className="w-full max-w-md p-6 emboss-card rounded-[32px] backdrop-blur-md bg-white/30 dark:bg-[#121212]/30 border border-white/10">
                        <p className="text-[9px] uppercase font-black text-[#ff4655] mb-1 tracking-[0.2em] opacity-90">Ability Detail</p>
                        
                        <div className="relative">
                          {isEditingCallout ? (
                            <div className="space-y-4">
                                <div><label className="text-[9px] font-black text-gray-400 uppercase tracking-widest opacity-60">Edit Callout</label><input autoFocus value={editForm.callout} onChange={e => setEditForm({...editForm, callout: e.target.value})} className="w-full bg-transparent border-b-2 border-[#ff4655] py-1 text-xl font-black outline-none tracking-tight" /></div>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setIsEditingCallout(false)} className="text-[9px] px-4 py-2 opacity-50 font-black uppercase tracking-widest">CANCEL</button>
                                    <button onClick={saveAgentOverride} className="bg-[#ff4655] text-white px-6 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center shadow-lg shadow-[#ff4655]/30 min-w-[100px]">{isGlobalSaving ? <div className="loading-spinner"></div> : 'SAVE'}</button>
                                </div>
                            </div>
                          ) : (
                            <div className="flex flex-col gap-3">
                              <div className="flex items-center gap-3 group">
                                <h2 className="text-xl font-black tracking-tighter uppercase italic opacity-40 leading-none">{skill.nameEn}</h2>
                                <button onClick={() => { setEditForm({callout: agentOverrides[`${selectedAgent.id}_${skill.slot}`]?.callout || skill.callout}); setIsEditingCallout(true); }} className="opacity-0 group-hover:opacity-100 text-[#ff4655] transition-all hover:scale-110"><Edit3 size={14}/></button>
                              </div>
                              
                              <div className="flex justify-between items-end">
                                <div className="space-y-2">
                                  <div className="text-4xl font-black tracking-tighter leading-none dark:text-white drop-shadow-sm">{agentOverrides[`${selectedAgent.id}_${skill.slot}`]?.callout || skill.callout}</div>
                                  <div className="text-[#ff4655] font-black text-[11px] tracking-[0.05em] bg-[#ff4655]/10 py-1 px-3 rounded-lg w-fit shadow-inner">読み: {skillHira}</div>
                                </div>
                                <button onClick={() => speak(agentOverrides[`${selectedAgent.id}_${skill.slot}`]?.callout || skill.callout)} className="w-14 h-14 bg-black dark:bg-white text-white dark:text-black rounded-full flex items-center justify-center shadow-2xl hover:scale-105 active:scale-90 transition-all border-4 border-[#ff4655]/10"><Volume2 size={24}/></button>
                              </div>
                            </div>
                          )}
                        </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen dark:bg-[#121212] bg-[#e0e5ec] text-gray-900 dark:text-white transition-all">
              <nav className="fixed top-0 w-full z-50 bg-white/70 dark:bg-[#121212]/60 backdrop-blur-xl h-16 flex items-center px-6 justify-between border-b border-black/5 dark:border-white/5">
                <div className="font-black text-xl tracking-tighter uppercase italic">Valo<span className="text-[#ff4655] mx-1 font-black">の</span>日本語</div>
                <button onClick={() => setIsDark(!isDark)} className="w-10 h-10 rounded-full emboss-btn flex items-center justify-center text-gray-500">{isDark ? <Moon size={18} /> : <Sun size={18} />}</button>
              </nav>

              {view === 'agents' ? (
                <div className="max-w-7xl mx-auto px-6 pt-24 pb-40 animate-fade-in">
                  <div className="flex flex-col items-center mb-16">
                    <div className="relative w-full max-w-sm emboss-soft rounded-[28px] overflow-hidden mb-10 shadow-inner">
                        <Search className="absolute left-6 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                        <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="SEARCH AGENT..." className="w-full bg-transparent py-5 pl-14 pr-6 focus:outline-none font-black text-xs tracking-widest uppercase italic" />
                    </div>
                    
                    <div className="p-2 emboss-frame rounded-full flex gap-1 bg-black/5 dark:bg-white/5 overflow-x-auto hide-scrollbar max-w-full shadow-inner">
                        {ROLE_MAPPING.map(role => (
                            <button 
                                key={role.id} 
                                onClick={() => setSelectedRole(role.id)} 
                                className={`px-6 py-2.5 rounded-full transition-all flex items-center justify-center ${selectedRole === role.id ? 'bg-white dark:bg-white text-black shadow-xl scale-105' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                <span className="text-[11px] font-black uppercase">{role.label}</span>
                            </button>
                        ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    {filteredAgents.map((a, i) => (
                      <div key={a.id} onClick={() => setSelectedAgent(a)} className="group relative h-[320px] emboss-card rounded-[32px] overflow-hidden cursor-pointer hover:-translate-y-2 transition-all duration-500 animate-fade-up shadow-xl" style={{animationDelay: `${i * 0.01}s`}}>
                        <div className="absolute inset-0 flex items-center justify-center translate-y-10 group-hover:translate-y-4 transition-transform duration-700 pointer-events-none">
                            <img src={a.fullPortrait} className="h-[110%] object-cover drop-shadow-[0_12px_24px_rgba(0,0,0,0.25)]" loading="lazy" />
                        </div>
                        <div className="absolute inset-x-0 bottom-0 p-5 bg-gradient-to-t from-white/95 dark:from-black via-transparent pt-32">
                            <div className="flex flex-col">
                                <span className="text-xl font-black tracking-tighter uppercase italic leading-none mb-1">{a.name}</span>
                                <span className="text-[9px] font-black opacity-50 uppercase tracking-[0.2em]">{a.nameJa}</span>
                            </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : <PhrasePage />}

              <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[90]">
                <div className="p-1.5 emboss-frame rounded-[32px] flex gap-1.5 backdrop-blur-3xl bg-white/30 dark:bg-black/40 border border-white/20 shadow-[0_15px_40px_rgba(0,0,0,0.3)]">
                  <button onClick={() => setView('agents')} className={`flex items-center gap-2.5 px-6 py-2.5 rounded-[24px] font-black transition-all ${view === 'agents' ? 'bg-black dark:bg-white text-white dark:text-black scale-105 shadow-xl uppercase italic' : 'text-gray-400 opacity-60'}`}>
                    <Users size={16} /><span className="text-[9px] tracking-[0.2em]">AGENT</span>
                  </button>
                  <button onClick={() => setView('phrases')} className={`flex items-center gap-2.5 px-6 py-2.5 rounded-[24px] font-black transition-all ${view === 'phrases' ? 'bg-black dark:bg-white text-white dark:text-black scale-105 shadow-xl uppercase italic' : 'text-gray-400 opacity-60'}`}>
                    <MessageCircle size={16} /><span className="text-[9px] tracking-[0.2em]">PHRASE</span>
                  </button>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
